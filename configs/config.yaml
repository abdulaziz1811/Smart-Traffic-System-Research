# =====================================================================
#  Smart Traffic Signal Control System -- Configuration
# =====================================================================

# -- Paths ------------------------------------------------------------
paths:
  images_dir: "data/raw/DETRAC-Images/DETRAC-Images"
  xml_dir: "data/annotations/DETRAC-Train-Annotations-XML/DETRAC-Train-Annotations-XML"
  annotations_dir: "data/annotations"
  weights_dir: "models/weights"
  results_dir: "outputs/results"
  log_dir: "outputs/logs"

# -- Dataset ----------------------------------------------------------
dataset:
  name: "UA-DETRAC"
  split_ratios: { train: 0.70, val: 0.15, test: 0.15 }
  categories: { car: 1, bus: 2, van: 3, others: 4 }
  num_classes: 4
  # NOTE: these are COCO category ids (1-indexed) used in the JSON files.
  # The model itself uses contiguous 0-indexed labels (0=Car ... 3=Others),
  # because HF DETR reserves index `num_labels` for "no object".
  default_image_size: [960, 540]

# -- Augmentation -----------------------------------------------------
augmentation:
  horizontal_flip: 0.5      # flip probability (0 disables)
  brightness_contrast: 0.2  # ColorJitter strength for brightness & contrast (0 disables)

# -- Model (DETR) -----------------------------------------------------
model:
  backbone: "resnet50"
  pretrained_model: "facebook/detr-resnet-50"
  image_size: { shortest_edge: 480, longest_edge: 640 }
  image_mean: [0.485, 0.456, 0.406]
  image_std:  [0.229, 0.224, 0.225]

# -- Training (tuned for MacBook) -------------------------------------
training:
  seed: 42
  epochs: 10
  batch_size: 4
  gradient_accumulation: 4
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  max_grad_norm: 0.1
  scheduler: "cosine"
  warmup_ratio: 0.05
  early_stopping: { enabled: true, patience: 3, min_delta: 0.001 }
  checkpointing: { keep_last_n: 2 }
  dataloader: { num_workers: 2, pin_memory: true, drop_last: true }

# -- Inference --------------------------------------------------------
inference:
  confidence_threshold: 0.5
  nms_threshold: 0.5

# -- Tracking (SORT) --------------------------------------------------
tracking:
  max_age: 30
  min_hits: 3
  iou_threshold: 0.3

# -- Reinforcement Learning -------------------------------------------
# All keys below are read directly by TrafficSignalEnv.__init__().
# Do NOT nest them under "env_config" -- the environment reads them flat.
rl:
  num_approaches: 8         # 8 lanes: N/S/E/W x straight + left turn
  num_phases: 4             # 4-phase cycle: NS-str, NS-left, EW-str, EW-left
  max_steps: 3600           # episode length in simulation seconds
  min_green: 5              # minimum green before agent can switch (seconds)
  max_green: 60             # forced switch after this duration (seconds)
  yellow_time: 3            # lost time (yellow + all-red) after every switch, no lane served
  startup_lost_time: 2      # first seconds of a new green discharge nobody (driver reaction)
  action_mode: "cyclic"     # "cyclic" = Discrete(2) extend/next | "free" = pick any phase
  service_rate: 0.5         # saturation flow per green lane (veh/s) = 1800 veh/h, measured in SUMO
  arrival_rate_low: 0.02    # min Poisson arrival rate (randomized per episode)
  arrival_rate_high: 0.12   # max Poisson arrival rate
  switch_penalty: -5.0      # NOTE: not used by the current reward (see _compute_reward)
  trend_window: 4           # snapshots used for the queue trend (avg change per step)
  reward_type: "queue"      # "queue" = -total queue (delay) | "shaped" = original multi-term reward

# -- Video Pipeline (track_video.py) ------------------------------------
# One polygon per lane in the 960x540 processed frame, lane order:
#   0 N straight, 1 N left, 2 S straight, 3 S left,
#   4 E straight, 5 E left, 6 W straight, 7 W left
# The defaults assume a top-down view with right-hand traffic; calibrate
# them for your camera with:  python calibrate_zones.py --video <file>
video:
  frame_size: [960, 540]
  queue_mode: "stopped"         # "stopped" = only vehicles slower than the threshold | "all"
  stopped_speed_px_s: 20        # below this ground-point speed a tracked vehicle counts as queued
  lane_zones:
    - [[350, 0], [412, 0], [412, 250], [350, 250]]      # 0 N straight
    - [[412, 0], [475, 0], [475, 250], [412, 250]]      # 1 N left
    - [[537, 300], [600, 300], [600, 540], [537, 540]]  # 2 S straight
    - [[475, 300], [537, 300], [537, 540], [475, 540]]  # 3 S left
    - [[600, 150], [960, 150], [960, 212], [600, 212]]  # 4 E straight
    - [[600, 212], [960, 212], [960, 275], [600, 275]]  # 5 E left
    - [[0, 337], [350, 337], [350, 400], [0, 400]]      # 6 W straight
    - [[0, 275], [350, 275], [350, 337], [0, 337]]      # 7 W left

# -- Vision-Language Model (src/vlm.py) ---------------------------------
# Claude reads the camera frame to confirm emergency vehicles and incidents
# and writes the operations-room report. Needs an Anthropic API key
# (ANTHROPIC_API_KEY) or an `ant auth login` profile; without one the
# system falls back to template reports and no emergency pre-emption.
vlm:
  enabled: true
  model: "claude-opus-5-5"
  effort: "low"                 # latency-sensitive scene classification
  max_tokens: 8000
  timeout_s: 60
  server_side_fallbacks: true   # re-run declined requests on the recommended fallback model
  image_max_width: 960
  jpeg_quality: 80
  scan_interval_s: 10           # periodic scene check in track_video.py (cost: one request each)
  stall_trigger_s: 30           # extra check when a lane's stopped vehicles do not move for this long
  preempt_s: 20                 # green hold for a confirmed emergency vehicle
